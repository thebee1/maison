<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#dfe6ec;--ink:#17202b;--paper:#f3f5f7;--sun:#f2c14e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d}}
:root[data-theme="dark"]{--bg:#10161d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Bricolage Grotesque",system-ui,sans-serif;color:var(--paper);overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.glass{background:rgba(23,32,43,.84);backdrop-filter:blur(8px);border-radius:14px}
#info{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top,0px));max-width:min(340px,60vw);padding:14px 18px}
#info h2{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
#info .m{margin:2px 0 6px;color:var(--sun);font-weight:600}
#info p{margin:0;font-size:.95rem;line-height:1.45;opacity:.9}
#map{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));padding:8px}
#map canvas{display:block;width:130px;height:78px}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;max-width:calc(100vw - 16px);overflow-x:auto}
#bar button{font:inherit;font-weight:600;font-size:.92rem;color:var(--paper);background:transparent;border:0;border-radius:10px;padding:10px 13px;cursor:pointer;white-space:nowrap}
#bar button:hover{background:rgba(255,255,255,.1)}
#bar button.on{background:var(--sun);color:var(--ink)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));font-size:.85rem;padding:6px 12px;white-space:nowrap}
#pad{display:none;position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:8px}
#pad button{width:58px;height:58px;font-size:1.4rem;border:0;border-radius:50%;background:rgba(23,32,43,.84);color:var(--paper);touch-action:none}
@media (pointer:coarse){#pad{display:flex}#hint{display:none}}
#intro{position:fixed;inset:0;display:flex;align-items:flex-end;padding:20px;background:linear-gradient(90deg,rgba(16,22,29,.75),rgba(16,22,29,0) 70%)}
#intro .card{max-width:440px;padding:26px 28px;margin-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#intro h1{margin:0 0 8px;font-size:clamp(2rem,6vw,3rem);line-height:1;font-weight:800;letter-spacing:-.03em}
#intro p{margin:0 0 18px;line-height:1.5;opacity:.9}
#go{font:inherit;font-weight:800;font-size:1.05rem;background:var(--sun);color:var(--ink);border:0;border-radius:12px;padding:13px 22px;cursor:pointer}
#intro.off{display:none}
@media (max-width:560px){#bar button{padding:9px 9px;font-size:.8rem}#info h2{font-size:1.2rem}#info p{display:none}#map canvas{width:100px;height:60px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Visite 3D de la maison"></canvas>
<div id="info" class="glass"><h2></h2><div class="m"></div><p></p></div>
<div id="map" class="glass"><canvas width="300" height="180"></canvas></div>
<div id="hint" class="glass">Glissez pour regarder · Z Q S D ou flèches pour marcher · l’escalier se monte à pied</div>
<div id="pad"><button id="pf" aria-label="Avancer">▲</button><button id="pb" aria-label="Reculer">▼</button></div>
<div id="bar" class="glass">
<button data-r="top0">Plan RDC</button><button data-r="top1">Plan étage</button><button data-r="cuisine">Cuisine</button><button data-r="salon">Salon</button><button data-r="chambre">Chambre</button>
</div>
<div id="intro"><div class="card glass">
<h1>Maison 3 pièces, deux niveaux</h1>
<p>Cuisine et salon au rez-de-chaussée, chambre à l’étage. Marchez dans la maison, montez l’escalier, ou volez d’une pièce à l’autre.</p>
<button id="go">Commencer la visite</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
(()=>{const c=document.createElement('canvas');c.width=2;c.height=256;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#8fbbe3');gr.addColorStop(1,'#eaf2f7');g.fillStyle=gr;g.fillRect(0,0,2,256);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;scene.background=t})();
scene.fog=new THREE.Fog(0xdbe8f0,28,70);
const cam=new THREE.PerspectiveCamera(70,1,.05,120);cam.rotation.order='YXZ';

scene.add(new THREE.HemisphereLight(0xdfeeff,0x8a7f72,.6));
const sun=new THREE.DirectionalLight(0xfff1d6,1.1);
sun.position.set(14,16,10);sun.target.position.set(5,0,3);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:45});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;

const gDown=new THREE.Group(),gUp=new THREE.Group(),gRoof=new THREE.Group();
scene.add(gDown,gUp,gRoof);
const LV=2.9,H=2.7;let Y0=0;
const mats={};
const mat=c=>mats[c]||(mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:.8,metalness:0}));
const glass=new THREE.MeshStandardMaterial({color:0xcfe3ee,transparent:true,opacity:.3,roughness:.1});
const solids=[];
function bx(x,y,z,w,h,d,c,col=true,cast=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='object'?c:mat(c));
  m.position.set(x,Y0+y+h/2,z);m.castShadow=cast;m.receiveShadow=true;(Y0?gUp:gDown).add(m);
  if(col)solids.push({x1:x-w/2,x2:x+w/2,z1:z-d/2,z2:z+d/2,lv:Y0?1:0});
  return m;
}
function cy(x,y,z,r,h,c,col=false,seg=18){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat(c));
  m.position.set(x,Y0+y+h/2,z);m.castShadow=m.receiveShadow=true;(Y0?gUp:gDown).add(m);
  if(col)solids.push({x1:x-r,x2:x+r,z1:z-r,z2:z+r,lv:Y0?1:0});
}
function tex(draw,rx,rz,rough){
  const c=document.createElement('canvas');c.width=c.height=256;draw(c.getContext('2d'));
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,rz);t.anisotropy=8;t.encoding=THREE.sRGBEncoding;
  return new THREE.MeshStandardMaterial({map:t,roughness:rough});
}
const wood=(rx,rz)=>tex(g=>{for(let i=0;i<8;i++){g.fillStyle=`hsl(${28+i%2*3},${38+i%3*5}%,${46+i%4*3}%)`;g.fillRect(0,i*32,256,32);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,i*32,256,2);for(let k=0;k<6;k++){g.fillStyle='rgba(60,30,10,.07)';g.fillRect(Math.random()*256,i*32+4+Math.random()*24,40+Math.random()*60,1.5)}}},rx,rz,.5);
const tiles=(rx,rz)=>tex(g=>{g.fillStyle='#e9edf0';g.fillRect(0,0,256,256);g.strokeStyle='#b5c0c9';g.lineWidth=4;g.strokeRect(0,0,256,256);g.beginPath();g.moveTo(128,0);g.lineTo(128,256);g.moveTo(0,128);g.lineTo(256,128);g.stroke()},rx,rz,.3);
function plane(x1,x2,z1,z2,y,m,g,up=true){
  const p=new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,z2-z1),m);p.rotation.x=up?-Math.PI/2:Math.PI/2;p.position.set((x1+x2)/2,y,(z1+z2)/2);p.receiveShadow=true;g.add(p);
}
function slab(x1,x2,z1,z2,top){
  const b=new THREE.Mesh(new THREE.BoxGeometry(x2-x1,.2,z2-z1),mat(0xf6f6f4));b.position.set((x1+x2)/2,2.8,(z1+z2)/2);b.receiveShadow=true;gUp.add(b);
  plane(x1,x2,z1,z2,LV+.005,top,gUp);
}
function lamp(x,z,lvl){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.04,20),new THREE.MeshBasicMaterial({color:0xfff2cc}));
  m.position.set(x,lvl*LV+H-.02,z);(lvl?gUp:gDown).add(m);
  const l=new THREE.PointLight(0xffe6bf,.4,8);l.position.set(x,lvl*LV+H-.3,z);(lvl?gUp:gDown).add(l);
}

// Extérieur
const grass=new THREE.Mesh(new THREE.PlaneGeometry(160,160),mat(0x8fb078));grass.rotation.x=-Math.PI/2;grass.position.set(5,-.15,3);grass.receiveShadow=true;scene.add(grass);
bx(5,-.15,3,10.6,.15,6.6,0x9a9a96,false);bx(5,-.15,8,10,.15,3,0xbab5aa,false);
function tree(x,z,s){
  cy(x,0,z,.15*s,1.6*s,0x6b4b32);gDown.children.length;
  [[0,2.2,0,1.2],[.5,2.9,.2,.9],[-.4,3.1,-.2,.8]].forEach(([a,b,c,r])=>{const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r*s,1),mat(0x4f8a5b));m.position.set(x+a*s,b*s,z+c*s);m.castShadow=true;scene.add(m)});
}
tree(-3,1.5,1.3);tree(13,6,1.1);tree(-2.5,8.5,1);tree(12.5,-2,1.4);tree(1,-4,1.2);

// Murs
const WC=0xf0f0ee;
function shell(){
  bx(5,0,0,10.2,H,.2,WC);bx(5,0,6,10.2,H,.2,WC);bx(0,0,3,.2,H,6.2,WC);bx(10,0,3,.2,H,6.2,WC);
}
function divider(x){bx(x,0,1.2,.2,H,2.4,WC);bx(x,0,4.8,.2,H,2.4,WC);bx(x,2.1,3,.2,.6,1.2,WC,false)}
function win(p,ax,w,h,y){
  const pane=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:0xd6ecff}));
  const bars=[[0,0,.06,h],[0,0,w,.06],[-w/2,0,.07,h],[w/2,0,.07,h],[0,-h/2,w,.07],[0,h/2,w,.07]];
  if(ax==='z'){pane.position.set(p,Y0+y+h/2,.105);bars.forEach(([a,b,sw,sh])=>bx(p+a,y+h/2+b,.12,sw,sh,.03,0xffffff,false,false))}
  else{pane.rotation.y=-Math.PI/2;pane.position.set(9.895,Y0+y+h/2,p);bars.forEach(([a,b,sw,sh])=>bx(9.88,y+h/2+b,p+a,.03,sh,sw,0xffffff,false,false))}
  (Y0?gUp:gDown).add(pane);
}
function art(x,y,z,w,h,c,ax='z'){
  if(ax==='z'){bx(x,y,z,w+.08,h+.08,.03,0x2b2b2b,false);bx(x,y+.04,z+.01,w,h,.03,c,false)}
  else{bx(z,y,x,.03,h+.08,w+.08,0x2b2b2b,false);bx(z+.01,y+.04,x,.03,h,w,c,false)}
}

// ===== Rez-de-chaussée =====
plane(0,4,0,6,0,tiles(4,6),gDown);plane(4,10,0,6,0,wood(6,6),gDown);
shell();divider(4);
win(3,'z',1.2,1.1,1.1);win(5.3,'z',1.3,1.4,.9);win(7.3,'z',1.3,1.4,.9);win(3.1,'x',1.1,1.4,.9);
// Cuisine
bx(2,0,.4,3.8,.9,.7,0xf4f4f1);bx(2,.9,.4,3.8,.05,.74,0x30353d,false);
bx(1,1.5,.2,1.8,.7,.4,0xe9c46a);bx(.4,0,2.6,.7,.9,3.8,0xf4f4f1);bx(.4,.9,2.6,.74,.05,3.8,0x30353d,false);
bx(.45,0,5.3,.8,1.9,.9,0xcfd6dc);bx(2.5,0,3.4,1.6,.9,.9,0x2f6f73);bx(2.5,.9,3.4,1.7,.05,1,0xe0dbd2,false);
[1.9,2.5,3.1].forEach(x=>{cy(x,0,4.25,.17,.05,0x30353d);cy(x,.05,4.25,.02,.55,0x888888);cy(x,.6,4.25,.2,.07,0xe9c46a)});
bx(1.2,.95,.4,.6,.02,.4,0x1c2229,false);bx(1.2,.97,.4,.5,.02,.3,0x555e68,false);
cy(.9,.95,.4,.12,.18,0xb9b9b9);art(2,1.6,.12,.7,.5,0xd9a441);
lamp(2,3,0);
// Salon
bx(6.6,0,3.3,3.6,.02,2.6,0x41576b,false,false);
bx(6.6,0,5.65,2.2,.45,.5,0x5b4636);bx(6.6,.7,5.82,1.7,.95,.06,0x111418,false);bx(6.6,.73,5.78,1.6,.88,.02,0x1c2a3a,false);
bx(6.6,0,5.89,3.4,H,.02,0x7a9a86,false,false);
bx(6.6,0,2.4,2.4,.4,.95,0x6d8b7a);bx(6.6,.4,1.95,2.4,.55,.25,0x5d7a6a,false);
bx(5.4,0,2.4,.25,.65,.95,0x5d7a6a,false);bx(7.8,0,2.4,.25,.65,.95,0x5d7a6a,false);
bx(5.9,.4,2.4,.5,.12,.5,0xe9c46a,false);
bx(6.6,0,3.6,1.2,.4,.6,0x8a6a4c);bx(6.6,.4,3.6,1.3,.03,.7,0x6b4f38,false);
bx(4.3,0,5.2,.35,2,1.4,0x5b4636);[.5,1,1.5].forEach(y=>bx(4.32,y,5.2,.3,.03,1.35,0x8a6a4c,false));
cy(7.9,0,5.3,.22,.38,0xb9856a);const pl=new THREE.Mesh(new THREE.IcosahedronGeometry(.38,1),mat(0x4f8a5b));pl.position.set(7.9,.85,5.3);pl.castShadow=true;gDown.add(pl);
cy(4.6,0,.8,.15,.04,0x333333);cy(4.6,.04,.8,.02,1.5,0x333333);cy(4.6,1.5,.8,.2,.25,0xfff0c8);
art(9.1,1.3,.12,.7,.9,0x3b6f8f);lamp(7,3,0);
// Escalier
for(let i=0;i<14;i++)bx(9.25,0,4.9-(i+.5)*3.6/14,1.3,(i+1)*LV/14,3.6/14,0xb08a62,false);
bx(8.55,0,3.1,.1,1,3.6,0xf0f0ee);

// ===== Étage =====
Y0=LV;
slab(0,6,0,6,mat(0xaab4c0));slab(6,8.6,0,6,wood(1.3,3));slab(8.6,10,0,1.3,wood(.7,.65));slab(8.6,10,4.9,6,wood(.7,.55));
shell();divider(6);
win(1.1,'z',1.2,1.3,.9);win(4.9,'z',1.2,1.3,.9);win(7.6,'z',1,1.3,.9);win(3.1,'x',1.1,1.4,.9);
bx(8.55,0,3.1,.05,1,3.6,glass,true,false);bx(8.55,1,3.1,.08,.05,3.6,0x30353d,false);
bx(9.3,0,4.9,1.4,1,.05,glass,true,false);bx(9.3,1,4.9,1.4,.05,.08,0x30353d,false);
// Chambre
bx(3,0,3.2,3.2,.02,2.8,0x6b86a8,false,false);
bx(3,0,1.25,1.8,.45,2,0xf1f1ee);bx(3,.45,1.55,1.8,.1,1.4,0x6b86a8,false);bx(3,.45,.2,1.9,.95,.1,0x5b4636,false);
bx(2.5,.55,.6,.6,.12,.35,0xffffff,false);bx(3.5,.55,.6,.6,.12,.35,0xffffff,false);
bx(1.7,0,.4,.5,.5,.5,0x8a6a4c);bx(4.3,0,.4,.5,.5,.5,0x8a6a4c);
cy(1.7,.5,.4,.1,.03,0x333333);cy(1.7,.53,.4,.15,.2,0xfff0c8);
bx(.45,0,3.4,.7,2.2,2.4,0xe4dfd6);bx(4.6,0,5.6,1.4,.75,.6,0x8a6a4c);bx(4.6,.9,5.75,.5,.3,.05,0x222a33,false);cy(4.6,0,5.0,.2,.45,0x30353d);
art(3,1.55,.12,1.1,.7,0xd9a441);lamp(3,3,1);
// Palier
bx(7.3,0,5.5,1.2,.6,.5,0x8a6a4c);art(7.3,1.3,5.88,.8,.6,0x7a9a86);
cy(9.4,0,5.5,.2,.38,0xb9856a);const p2=new THREE.Mesh(new THREE.IcosahedronGeometry(.34,1),mat(0x4f8a5b));p2.position.set(9.4,LV+.8,5.5);p2.castShadow=true;gUp.add(p2);
lamp(7.3,3,1);Y0=0;

// Toit (masqué en plan)
{const r=new THREE.Mesh(new THREE.BoxGeometry(11,.25,7),mat(0xd3d7db));r.position.set(5,2*LV-.2+.125+.1,3);r.castShadow=false;gRoof.add(r);
 plane(0,10,0,6,2*LV-.1,mat(0xf6f6f4),gRoof,false)}
const roofY=LV+H;gRoof.position.y=roofY-(2*LV-.1)+0; // plafond de l’étage à y=5.6

// Collision
const R=.3;let lvl=0;
const blocked=(x,z)=>solids.some(s=>s.lv===lvl&&x>s.x1-R&&x<s.x2+R&&z>s.z1-R&&z<s.z2+R);
const inSt=(x,z)=>x>8.6&&x<9.9&&z>1.3&&z<4.9;
const ramp=z=>Math.max(0,Math.min(LV,(4.9-z)/3.6*LV));

// Poses
const look=(px,pz,tx,tz)=>Math.atan2(-(tx-px),-(tz-pz));
const P={
  cuisine:{x:3.3,z:5.3,y:1.6,yaw:look(3.3,5.3,1.5,1),pitch:-.05,l:0},
  salon:{x:4.9,z:1.5,y:1.6,yaw:look(4.9,1.5,8,4.6),pitch:-.08,l:0},
  chambre:{x:5.3,z:3,y:LV+1.6,yaw:look(5.3,3,2.5,.8),pitch:-.05,l:1}
};
const topY=()=>Math.max(9.5,9.5/cam.aspect+1);
const topPose=l=>({x:5,z:3.2,y:topY()+l*LV,yaw:0,pitch:-1.5,l});
const INFO={
  top0:['Plan du rez-de-chaussée','Cuisine et salon · 60 m²','Cliquez sur une pièce pour la visiter. L’escalier est à droite.'],
  top1:['Plan de l’étage','Chambre et palier · 60 m²','Cliquez sur la chambre pour la visiter. L’escalier arrive sur le palier.'],
  cuisine:['Cuisine','24 m²','Plan de travail en L, îlot central et trois tabourets.'],
  salon:['Salon','36 m²','Pièce de vie lumineuse avec trois fenêtres, canapé, coin télé, bibliothèque et escalier.'],
  chambre:['Chambre','36 m² · étage','Lit double, grande armoire, bureau et deux fenêtres sur le jardin.'],
  palier:['Palier','Étage','Passage entre l’escalier et la chambre, avec fenêtre sur le jardin.'],
  escalier:['Escalier','Rez-de-chaussée ↔ étage','14 marches, rampe vitrée côté palier.']
};

let cur={...topPose(0)},mode='top0',tw=null,shown='',foot=0;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function go(k){
  const to=k.startsWith('top')?topPose(+k[3]):P[k];
  tw={from:{...cur},to,t:0,dur:reduce?.01:2};
  mode=k.startsWith('top')?k:'walk';
}
function place(){
  if(inSt(cur.x,cur.z))return 'escalier';
  if(lvl===0)return cur.x<4?'cuisine':'salon';
  return cur.x<6?'chambre':'palier';
}
function hud(k){
  if(k===shown)return;shown=k;
  const i=INFO[k];$('#info h2').textContent=i[0];$('#info .m').textContent=i[1];$('#info p').textContent=i[2];
  document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.r===k));
}
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>go(b.dataset.r));
$('#go').onclick=()=>{$('#intro').classList.add('off');go('salon')};

const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let drag=null,pad={f:0};
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing'});
canvas.addEventListener('pointermove',e=>{
  if(!drag||mode!=='walk'||tw)return;
  cur.yaw-=(e.clientX-drag.x)*.005;cur.pitch=Math.max(-1.2,Math.min(1.2,cur.pitch-(e.clientY-drag.y)*.005));
  drag.x=e.clientX;drag.y=e.clientY;
});
const ray=new THREE.Raycaster();
canvas.addEventListener('pointerup',e=>{
  canvas.style.cursor='grab';
  if(drag&&mode!=='walk'&&!tw&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6){
    ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);
    const o=ray.ray.origin,d=ray.ray.direction,l=+mode[3],t=(l*LV-o.y)/d.y,x=o.x+d.x*t,z=o.z+d.z*t;
    if(x>0&&x<10&&z>0&&z<6){if(l===0)go(x<4?'cuisine':'salon');else if(x<6)go('chambre')}
  }
  drag=null;
});
[['#pf',1],['#pb',-1]].forEach(([s,v])=>{const b=$(s);b.onpointerdown=e=>{e.preventDefault();pad.f=v};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>pad.f=0});

// Mini-plan
const mg=$('#map canvas').getContext('2d'),S=30;
function drawMap(){
  const up=cur.y>3.6&&(mode==='walk'||mode==='top1'||tw);
  mg.clearRect(0,0,300,180);
  const r=up?[[0,6,'#9aa8b8'],[6,10,'#c9a97c']]:[[0,4,'#e8ecef'],[4,10,'#c9a97c']];
  r.forEach(([a,b,c])=>{mg.fillStyle=c;mg.fillRect(a*S,0,(b-a)*S,180);mg.strokeStyle='#17202b';mg.lineWidth=4;mg.strokeRect(a*S,0,(b-a)*S,180)});
  mg.fillStyle='rgba(23,32,43,.35)';mg.fillRect(8.6*S,1.3*S,1.3*S,3.6*S);
  mg.strokeStyle='rgba(23,32,43,.5)';mg.lineWidth=1.5;for(let i=1;i<14;i++){const y=(1.3+i*3.6/14)*S;mg.beginPath();mg.moveTo(8.6*S,y);mg.lineTo(9.9*S,y);mg.stroke()}
  const px=cur.x*S,pz=cur.z*S;
  mg.fillStyle='rgba(242,193,78,.55)';mg.beginPath();mg.moveTo(px,pz);mg.arc(px,pz,34,-Math.PI/2-cur.yaw-.6,-Math.PI/2-cur.yaw+.6);mg.closePath();mg.fill();
  mg.fillStyle='#f2c14e';mg.strokeStyle='#17202b';mg.lineWidth=3;mg.beginPath();mg.arc(px,pz,7,0,7);mg.fill();mg.stroke();
}

function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();if(mode!=='walk'&&!tw)Object.assign(cur,topPose(+mode[3]))}
addEventListener('resize',resize);resize();

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(tw){
    tw.t+=dt/tw.dur;const k=ease(Math.min(1,tw.t)),f=tw.from,t=tw.to;
    const dy=((t.yaw-f.yaw+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
    cur.x=f.x+(t.x-f.x)*k;cur.z=f.z+(t.z-f.z)*k;cur.y=f.y+(t.y-f.y)*k;cur.yaw=f.yaw+dy*k;cur.pitch=f.pitch+(t.pitch-f.pitch)*k;
    if(tw.t>=1){Object.assign(cur,t);lvl=t.l;tw=null}
  }else if(mode==='walk'){
    const sp=(keys.shift?4:2.2)*dt;
    const f=(keys.w||keys.z||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)+pad.f;
    const r=(keys.d?1:0)-(keys.q||keys.a?1:0);
    cur.yaw+=((keys.arrowleft?1:0)-(keys.arrowright?1:0))*1.8*dt;
    const sn=Math.sin(cur.yaw),cs=Math.cos(cur.yaw);
    const dx=(-sn*f+cs*r)*sp,dz=(-cs*f-sn*r)*sp;
    if(!blocked(cur.x+dx,cur.z))cur.x+=dx;
    if(!blocked(cur.x,cur.z+dz))cur.z+=dz;
    if(inSt(cur.x,cur.z)){foot=ramp(cur.z);lvl=foot>1.45?1:0}else foot=lvl*LV;
    cur.y=foot+1.6;
  }
  gUp.visible=mode!=='top0';
  gRoof.visible=mode==='walk'&&cur.y<6.2;
  cam.position.set(cur.x,cur.y,cur.z);cam.rotation.set(cur.pitch,cur.yaw,0);
  hud(mode==='walk'&&!tw?place():mode==='walk'?shown:mode);
  drawMap();
  renderer.render(scene,cam);
  requestAnimationFrame(loop);
}
hud('top0');
requestAnimationFrame(loop);
</script>
</body>
</html>
