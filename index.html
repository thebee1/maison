<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maison 3D — Visite immersive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root {
  --bg: #dfe6ec; --ink: #17202b; --paper: #f3f5f7; --sun: #f2c14e; --sage: #6d8b7a;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #10161d; } }
:root[data-theme="dark"] { --bg: #10161d; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); font-family: "Bricolage Grotesque", system-ui, sans-serif; color: var(--paper); overflow: hidden; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

.glass { background: rgba(23, 32, 43, 0.84); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

#info { position: fixed; left: 14px; top: calc(14px + env(safe-area-inset-top, 0px)); max-width: min(340px, 60vw); padding: 14px 18px; transition: opacity 0.3s; }
#info h2 { margin: 0; font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; }
#info .m { margin: 2px 0 6px; color: var(--sun); font-weight: 600; font-size: 0.9rem; }
#info p { margin: 0; font-size: .95rem; line-height: 1.45; opacity: .85; }

#map { position: fixed; right: 14px; top: calc(14px + env(safe-area-inset-top, 0px)); padding: 8px; }
#map canvas { display: block; width: 160px; height: 120px; border-radius: 8px; }

#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; padding: 6px; max-width: calc(100vw - 20px); overflow-x: auto; }
#bar button { font: inherit; font-weight: 600; font-size: .9rem; color: var(--paper); background: transparent; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; white-space: nowrap; transition: background 0.2s, color 0.2s; }
#bar button:hover { background: rgba(255,255,255,.1); }
#bar button.on { background: var(--sun); color: var(--ink); }

#hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); font-size: .85rem; padding: 6px 12px; opacity: .9; white-space: nowrap; pointer-events: none; }

#pad { display: none; position: fixed; right: 14px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); flex-direction: column; gap: 8px; z-index: 10; }
#pad button { width: 58px; height: 58px; font-size: 1.4rem; border: 0; border-radius: 50%; background: rgba(23, 32, 43, 0.84); color: var(--paper); touch-action: none; backdrop-filter: blur(10px); }
@media (pointer: coarse) { #pad { display: flex; } #hint { display: none; } }

#intro { position: fixed; inset: 0; display: flex; align-items: flex-end; padding: 20px; background: linear-gradient(90deg, rgba(16,22,29,.85), rgba(16,22,29,0) 70%); z-index: 50; transition: opacity 0.5s; }
#intro.off { opacity: 0; pointer-events: none; }
#intro .card { max-width: 450px; padding: 26px 28px; margin-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
#intro h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1; font-weight: 800; letter-spacing: -.03em; }
#intro p { margin: 0 0 18px; line-height: 1.5; opacity: .9; }
#go { font: inherit; font-weight: 800; font-size: 1.05rem; background: var(--sun); color: var(--ink); border: 0; border-radius: 12px; padding: 13px 22px; cursor: pointer; transition: transform 0.2s; }
#go:hover { transform: scale(1.02); }

@media (max-width: 560px) {
  #bar button { padding: 9px 10px; font-size: .8rem; }
  #info h2 { font-size: 1.3rem; }
  #info p { display: none; }
  #map canvas { width: 110px; height: 82px; }
}
</style>
</head>
<body>
<canvas id="c" aria-label="Visite 3D de la maison"></canvas>

<div id="info" class="glass"><h2>Vue d'ensemble</h2><div class="m">Maison complète</div><p>Cliquez sur une pièce ou utilisez le menu.</p></div>
<div id="map" class="glass"><canvas width="320" height="240"></canvas></div>
<div id="hint" class="glass">Glissez pour regarder · ZQSD / WASD pour marcher</div>

<div id="pad">
  <button id="pf" aria-label="Avancer">▲</button>
  <button id="pb" aria-label="Reculer">▼</button>
</div>

<div id="bar" class="glass">
  <button data-r="top">Vue d'ensemble</button>
  <button data-r="salon">Salon</button>
  <button data-r="cuisine">Cuisine</button>
  <button data-r="chambre">Chambre</button>
  <button data-r="garage">Garage</button>
</div>

<div id="intro">
  <div class="card glass">
    <h1>Maison 3D</h1>
    <p>Explorez le salon, la cuisine, les chambres et le garage. Passez d'une vue aérienne à une visite à la première personne en un clic.</p>
    <button id="go">Commencer la visite</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const $ = s => document.querySelector(s);
const canvas = $('#c');

// --- CONFIGURATION 3D ---
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfd9e2);
const cam = new THREE.PerspectiveCamera(70, 1, 0.05, 100);
cam.rotation.order = 'YXZ';

// --- LUMIÈRES ---
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f72, 0.8));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.6);
sun.position.set(5, 15, 5);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left = -15; sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15; sun.shadow.camera.bottom = -15;
scene.add(sun);

// Lumières intérieures (plafonniers)
[[-1, 3], [5, 3], [-1, -4], [6, -4], [-6, 3]].forEach(([x, z]) => {
  const l = new THREE.PointLight(0xffe9c4, 1.5, 10, 2);
  l.position.set(x, 2.6, z);
  scene.add(l);
});

// --- TEXTURES PROCÉDURALES ---
const mats = {};
const mat = (c, r = 0.85) => mats[c+''+r] || (mats[c+''+r] = new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0 }));

function tex(draw, rx, rz) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, rz);
  t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({ map: t, roughness: 0.8 });
}

const woodTex = (rx, rz) => tex(g => {
  for (let i = 0; i < 8; i++) {
    g.fillStyle = `hsl(30, ${36 + i % 3 * 5}%, ${48 + i % 4 * 3}%)`;
    g.fillRect(0, i * 32, 256, 32);
    g.fillStyle = 'rgba(0,0,0,.15)';
    g.fillRect(0, i * 32, 256, 2);
  }
}, rx, rz);

const tileTex = (rx, rz) => tex(g => {
  g.fillStyle = '#e8ecef';
  g.fillRect(0, 0, 256, 256);
  g.strokeStyle = '#bcc6ce';
  g.lineWidth = 4;
  g.strokeRect(0, 0, 256, 256);
  g.beginPath(); g.moveTo(128, 0); g.lineTo(128, 256); g.moveTo(0, 128); g.lineTo(256, 128); g.stroke();
}, rx, rz);

// --- OUTILS DE CONSTRUCTION ---
const solids = [];
const H = 2.8; // Hauteur des murs

function bx(x, y, z, w, h, d, c, col = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof c === 'object' ? c : mat(c));
  mesh.position.set(x, y + h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  if (col) solids.push({ x1: x - w / 2, x2: x + w / 2, z1: z - d / 2, z2: z + d / 2 });
  return mesh;
}

// --- PLAN DE LA MAISON ---
// X : -9 (Gauche) à 9 (Droite)
// Z : -7 (Haut) à 7 (Bas)

// 1. Sols
const floorGarage = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 7), mat(0x555555, 0.9));
floorGarage.rotation.x = -Math.PI / 2; floorGarage.position.set(-6.25, 0, 3.5); floorGarage.receiveShadow = true; scene.add(floorGarage);

const floorSalon = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), woodTex(6, 6));
floorSalon.rotation.x = -Math.PI / 2; floorSalon.position.set(-0.5, 0, 3.5); floorSalon.receiveShadow = true; floorSalon.userData.room = 'salon'; scene.add(floorSalon);

const floorCuisine = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), tileTex(6, 6));
floorCuisine.rotation.x = -Math.PI / 2; floorCuisine.position.set(-0.5, 0, -3.5); floorCuisine.receiveShadow = true; floorCuisine.userData.room = 'cuisine'; scene.add(floorCuisine);

const floorChambre = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 14), woodTex(4, 10));
floorChambre.rotation.x = -Math.PI / 2; floorChambre.position.set(6.25, 0, 0); floorChambre.receiveShadow = true; floorChambre.userData.room = 'chambre'; scene.add(floorChambre);

// Tapis décoratif dans le salon
const rug = new THREE.Mesh(new THREE.PlaneGeometry(4, 2.5), mat(0x41576b, 1));
rug.rotation.x = -Math.PI / 2; rug.position.set(-0.5, 0.01, 3); rug.receiveShadow = true; scene.add(rug);

// 2. Plafonds (pour la vue de dessus)
const ceilMat = mat(0xf6f6f4);
[[-6.25, 3.5, 5.5, 7], [-0.5, 3.5, 7, 7], [-0.5, -3.5, 7, 7], [6.25, 0, 5.5, 14]].forEach(([x, z, w, d]) => {
  const c = new THREE.Mesh(new THREE.PlaneGeometry(w, d), ceilMat);
  c.rotation.x = Math.PI / 2; c.position.set(x, H, z); scene.add(c);
});

// 3. Murs
const WC = 0xeceeed;
// Murs extérieurs
bx(0, 0, -7, 18.4, H, 0.2, WC);
bx(0, 0, 7, 18.4, H, 0.2, WC);
bx(-9, 0, 0, 0.2, H, 14.4, WC);
bx(9, 0, 0, 0.2, H, 14.4, WC);

// Murs intérieurs (avec portes)
// Séparation Garage / Salon
bx(-3.5, 0, 3.5, 0.2, H, 7, WC); // Mur plein
bx(-3.5, 0, 0.5, 0.2, H, 2, WC); // Partie haute
bx(-3.5, 0, 6.5, 0.2, H, 1, WC); // Partie basse

// Séparation Salon/Cuisine (Ouverture large)
bx(-0.5, 0, 0, 7, H, 0.2, WC);
// (On laisse un trou au milieu pour le passage)
solids.pop(); // Retire le collider du mur central pour laisser passer
bx(-0.5, 0, 0, 2, H, 0.2, WC, false); // Petit muret de séparation
bx(-0.5, 0, 0, 2, H, 0.2, WC, true);

// Séparation Salon / Chambres
bx(3, 0, 0, 0.2, H, 14, WC);

// Séparation Chambre haut / Chambre bas
bx(6.25, 0, 0, 6.5, H, 0.2, WC);

// 4. Fenêtres (Vitrage)
const winMat = new THREE.MeshBasicMaterial({ color: 0xc4e4ff });
function win(x, z, w, h, rotY = 0) {
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(w, h), winMat);
  pane.position.set(x, h/2 + 1, z); pane.rotation.y = rotY;
  scene.add(pane);
}
win(8.9, 3, 4, 1.4, -Math.PI/2); // Salon droite
win(-8.9, 3, 3, 1.4, Math.PI/2); // Garage gauche
win(-0.5, -6.9, 3, 1.4, 0); // Cuisine haut
win(6.5, 6.9, 2, 1.4, 0); // Chambre bas

// --- MOBILIER ---

// SALON
bx(-0.5, 0, 5, 3.5, 0.4, 1.2, 0xe0e0e0); // Canapé
bx(-0.5, 0.4, 5.6, 3.5, 0.6, 0.2, 0xe0e0e0); // Dossier
bx(-0.5, 0, 3.2, 1.8, 0.4, 1, 0x222222); // Table basse
bx(-0.5, 0, 1.5, 2.5, 0.5, 0.4, 0x6b4f3a); // Meuble TV
bx(-0.5, 0.8, 1.5, 1.8, 0.9, 0.05, 0x111418, false); // TV

// CUISINE
bx(-0.5, 0, -2.5, 2.5, 0.9, 1.2, 0xf1f1ee); // Îlot
bx(-0.5, 0.9, -2.5, 2.6, 0.05, 1.3, 0x3a3f47, false); // Plan de travail
bx(-0.5, 0, -6.5, 3.5, 0.9, 0.6, 0xf1f1ee); // Meuble mural
bx(-0.5, 0, -6.5, 3.5, 1.8, 0.4, 0xe9c46a); // Placards hauts
bx(2, 0, -6.5, 0.9, 2, 0.8, 0xcfd6dc); // Frigo

// CHAMBRE (Droite - Haut et Bas)
bx(6.25, 0, 3.5, 2, 0.5, 2.2, 0xe0e0e0); // Lit double
bx(6.25, 0.5, 4.6, 2.1, 0.8, 0.15, 0x6b4f3a); // Tête de lit
bx(4.8, 0, 3.5, 0.6, 0.5, 0.5, 0x6b4f3a); // Table de nuit
bx(7.7, 0, 3.5, 0.6, 0.5, 0.5, 0x6b4f3a); // Table de nuit
bx(8, 0, -3.5, 0.6, 2.2, 3, 0x6b4f3a); // Armoire

// GARAGE
bx(-6.25, 0, 3.5, 2, 0.7, 4, 0x222222); // Voiture
bx(-6.25, 0.7, 3.5, 1.8, 0.6, 2, 0xaaddff, false); // Pare-brise
bx(-8.5, 0, 6.5, 0.5, 0.8, 0.5, 0x2d6a4f); // Plante

// --- LOGIQUE DE VISITE (Poses et Transitions) ---
const R = 0.3;
const blocked = (x, z) => solids.some(s => x > s.x1 - R && x < s.x2 + R && z > s.z1 - R && z < s.z2 + R);

const look = (px, pz, tx, tz) => Math.atan2(-(tx - px), -(tz - pz));

const P = {
  salon: { x: -0.5, z: 3, y: 1.6, yaw: look(-0.5, 3, -0.5, 5), pitch: -0.1 },
  cuisine: { x: -0.5, z: -2, y: 1.6, yaw: look(-0.5, -2, -0.5, -5), pitch: -0.1 },
  chambre: { x: 6.25, z: 1, y: 1.6, yaw: look(6.25, 1, 6.25, 4), pitch: -0.1 },
  garage: { x: -6.25, z: 1, y: 1.6, yaw: look(-6.25, 1, -6.25, 5), pitch: -0.1 }
};

const topPose = () => ({ x: 0, z: 0, y: 14, yaw: 0, pitch: -Math.PI / 2 });

const INFO = {
  top: ['Vue d’ensemble', 'Maison complète', 'Cliquez sur une pièce pour la visiter, ou utilisez les boutons en bas.'],
  salon: ['Salon', 'Vaste séjour', 'Canapé, table basse, télévision et grande baie vitrée.'],
  cuisine: ['Cuisine', 'Îlot central', 'Plan de travail en L, îlot central et équipements modernes.'],
  chambre: ['Chambres', 'Espace nuit', 'Deux chambres spacieuses avec lits doubles et armoires.'],
  garage: ['Garage', 'Stationnement', 'Garage fermé pour une voiture, avec accès direct.'],
};

let cur = { x: 0, z: 0, y: 14, yaw: 0, pitch: -Math.PI / 2 };
let mode = 'top';
let tw = null;
let shown = '';

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function go(k) {
  const to = k === 'top' ? topPose() : P[k];
  tw = { from: { ...cur }, to, t: 0, dur: reduce ? 0.01 : 1.6 };
  mode = k === 'top' ? 'top' : 'walk';
}

function roomAt(x) {
  if (x < -3.5) return 'garage';
  if (x > 3) return 'chambre';
  if (cur.z > 0) return 'salon';
  return 'cuisine';
}

function hud(k) {
  if (k === shown) return;
  shown = k;
  const i = INFO[k];
  $('#info h2').textContent = i[0];
  $('#info .m').textContent = i[1];
  $('#info p').textContent = i[2];
  document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('on', b.dataset.r === k));
}

document.querySelectorAll('#bar button').forEach(b => b.onclick = () => go(b.dataset.r));
$('#go').onclick = () => { $('#intro').classList.add('off'); go('salon'); };

// --- CONTRÔLES ---
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = 1; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = 0; });

let drag = null;
let pad = { f: 0 };

canvas.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('pointermove', e => {
  if (!drag || mode !== 'walk' || tw) return;
  cur.yaw -= (e.clientX - drag.x) * 0.005;
  cur.pitch = Math.max(-1.2, Math.min(1.2, cur.pitch - (e.clientY - drag.y) * 0.005));
  drag.x = e.clientX; drag.y = e.clientY;
});

const ray = new THREE.Raycaster();
canvas.addEventListener('pointerup', e => {
  canvas.style.cursor = 'grab';
  if (drag && mode === 'top' && !tw && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) {
    ray.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, cam);
    const h = ray.intersectObjects([floorSalon, floorCuisine, floorChambre, floorGarage])[0];
    if (h) go(h.object.userData.room);
  }
  drag = null;
});

[['#pf', 1], ['#pb', -1]].forEach(([s, v]) => {
  const b = $(s);
  b.onpointerdown = e => { e.preventDefault(); pad.f = v; };
  b.onpointerup = b.onpointerleave = b.onpointercancel = () => pad.f = 0;
});

// --- MINI-MAP ---
const mc = $('#map canvas');
const mg = mc.getContext('2d');

function drawMap() {
  mg.clearRect(0, 0, 320, 240);
  mg.fillStyle = 'rgba(255,255,255,0.05)';
  mg.fillRect(0, 0, 320, 240);
  
  const S = 320 / 18; // échelle
  const X_OFF = 9, Z_OFF = 7;

  // Pièces
  mg.fillStyle = 'rgba(242,193,78,0.15)'; // Garage
  mg.fillRect((-9 + X_OFF) * S, (1 + Z_OFF) * S, 5.5 * S, 7 * S);
  
  mg.fillStyle = 'rgba(216,195,160,0.3)'; // Salon
  mg.fillRect((-3.5 + X_OFF) * S, (0 + Z_OFF) * S, 7 * S, 7 * S);
  
  mg.fillStyle = 'rgba(232,236,239,0.3)'; // Cuisine
  mg.fillRect((-3.5 + X_OFF) * S, (-7 + Z_OFF) * S, 7 * S, 7 * S);
  
  mg.fillStyle = 'rgba(154,168,184,0.3)'; // Chambres
  mg.fillRect((3 + X_OFF) * S, (-7 + Z_OFF) * S, 6 * S, 14 * S);

  // Joueur
  const px = (cur.x + X_OFF) * S;
  const pz = (cur.z + Z_OFF) * S;
  const a = cur.yaw;

  // Cône de vision
  mg.fillStyle = 'rgba(242,193,78,0.4)';
  mg.beginPath();
  mg.moveTo(px, pz);
  mg.arc(px, pz, 35, -Math.PI / 2 - a - 0.6, -Math.PI / 2 - a + 0.6);
  mg.closePath();
  mg.fill();

  // Point joueur
  mg.fillStyle = '#f2c14e';
  mg.strokeStyle = '#17202b';
  mg.lineWidth = 2;
  mg.beginPath();
  mg.arc(px, pz, 5, 0, 7);
  mg.fill();
  mg.stroke();
}

// --- BOUCLE D'ANIMATION ---
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  if (mode === 'top' && !tw) Object.assign(cur, topPose());
}
addEventListener('resize', resize);
resize();
Object.assign(cur, topPose());

let last = performance.now();

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (tw) {
    tw.t += dt / tw.dur;
    const k = ease(Math.min(1, tw.t));
    const f = tw.from, t = tw.to;
    const dy = ((t.yaw - f.yaw + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    
    cur.x = f.x + (t.x - f.x) * k;
    cur.z = f.z + (t.z - f.z) * k;
    cur.y = f.y + (t.y - f.y) * k;
    cur.yaw = f.yaw + dy * k;
    cur.pitch = f.pitch + (t.pitch - f.pitch) * k;
    
    if (tw.t >= 1) { Object.assign(cur, t); tw = null; }
  } else if (mode === 'walk') {
    const sp = (keys.shift ? 4 : 2.2) * dt;
    let f = (keys.w || keys.z || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0) + pad.f;
    let r = (keys.d ? 1 : 0) - (keys.q || keys.a ? 1 : 0);
    
    // Rotation clavier (flèches)
    cur.yaw += ((keys.arrowleft ? 1 : 0) - (keys.arrowright ? 1 : 0)) * 1.8 * dt;
    
    const sn = Math.sin(cur.yaw), cs = Math.cos(cur.yaw);
    const dx = (-sn * f + cs * r) * sp;
    const dz = (-cs * f - sn * r) * sp;
    
    if (!blocked(cur.x + dx, cur.z)) cur.x += dx;
    if (!blocked(cur.x, cur.z + dz)) cur.z += dz;
  }

  cam.position.set(cur.x, cur.y, cur.z);
  cam.rotation.set(cur.pitch, cur.yaw, 0);

  // Gestion de l'interface
  hud(mode === 'top' && !tw ? 'top' : roomAt(cur.x));
  drawMap();
  
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}

hud('top');
requestAnimationFrame(loop);
