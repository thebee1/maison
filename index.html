<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Maison 3D — Visite immersive (2 niveaux)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root { --bg: #dfe6ec; --ink: #17202b; --paper: #f3f5f7; --sun: #f2c14e; --sage: #6d8b7a; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #10161d; } }
:root[data-theme="dark"] { --bg: #10161d; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); font-family: "Bricolage Grotesque", system-ui, sans-serif; color: var(--paper); overflow: hidden; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.glass { background: rgba(23, 32, 43, 0.85); backdrop-filter: blur(14px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

#info { position: fixed; left: 14px; top: calc(14px + env(safe-area-inset-top, 0px)); max-width: min(340px, 60vw); padding: 14px 18px; transition: opacity 0.3s; z-index: 20; }
#info h2 { margin: 0; font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; }
#info .m { margin: 2px 0 6px; color: var(--sun); font-weight: 600; font-size: 0.9rem; }
#info p { margin: 0; font-size: .95rem; line-height: 1.45; opacity: .85; }
#map { position: fixed; right: 14px; top: calc(14px + env(safe-area-inset-top, 0px)); padding: 8px; z-index: 20; }
#map canvas { display: block; width: 170px; height: 128px; border-radius: 8px; }
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; padding: 6px; max-width: calc(100vw - 20px); overflow-x: auto; z-index: 20; scrollbar-width: none; }
#bar::-webkit-scrollbar { display: none; }
#bar button { font: inherit; font-weight: 600; font-size: .9rem; color: var(--paper); background: transparent; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; white-space: nowrap; transition: background 0.2s, color 0.2s; }
#bar button:hover { background: rgba(255,255,255,.1); }
#bar button.on { background: var(--sun); color: var(--ink); }

#hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); font-size: .85rem; padding: 6px 12px; opacity: .9; white-space: nowrap; pointer-events: none; z-index: 20; }
@media (pointer: coarse) { #hint { display: none; } }

/* --- Mobile Joystick --- */
#joystick-zone { position: fixed; left: 0; bottom: 0; width: 40%; height: 60%; z-index: 15; display: none; touch-action: none; }
#joystick-base { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); transform: translate(-50%, -50%); display: none; pointer-events: none; }
#joystick-knob { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: rgba(242,193,78,0.8); top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.5); }
@media (pointer: coarse) { #joystick-zone { display: block; } }

#intro { position: fixed; inset: 0; display: flex; align-items: flex-end; padding: 20px; background: linear-gradient(90deg, rgba(16,22,29,.9), rgba(16,22,29,0) 70%); z-index: 50; transition: opacity 0.5s; }
#intro.off { opacity: 0; pointer-events: none; }
#intro .card { max-width: 460px; padding: 26px 28px; margin-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
#intro h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1; font-weight: 800; letter-spacing: -.03em; }
#intro p { margin: 0 0 18px; line-height: 1.5; opacity: .9; }
#go { font: inherit; font-weight: 800; font-size: 1.05rem; background: var(--sun); color: var(--ink); border: 0; border-radius: 12px; padding: 13px 22px; cursor: pointer; transition: transform 0.2s; }
#go:hover { transform: scale(1.02); }

@media (max-width: 560px) {
  #bar button { padding: 9px 10px; font-size: .8rem; }
  #info h2 { font-size: 1.3rem; }
  #info p { display: none; }
  #map canvas { width: 120px; height: 90px; }
}
</style>
</head>
<body>
<canvas id="c" aria-label="Visite 3D de la maison"></canvas>

<div id="info" class="glass"><h2>Vue d'ensemble</h2><div class="m">Maison complète</div><p>Cliquez sur une pièce ou utilisez le menu.</p></div>
<div id="map" class="glass"><canvas width="340" height="256"></canvas></div>

<div id="joystick-zone">
  <div id="joystick-base"><div id="joystick-knob"></div></div>
</div>

<div id="bar" class="glass">
  <button data-r="plan-rdc">Plan RDC</button>
  <button data-r="plan-etage">Plan Étage</button>
  <button data-r="salon">Salon</button>
  <button data-r="cuisine">Cuisine</button>
  <button data-r="garage">Garage</button>
  <button data-r="chambre1">Chambre 1</button>
  <button data-r="chambre2">Chambre 2</button>
  <button data-r="sdb">Salle de bain</button>
</div>

<div id="intro">
  <div class="card glass">
    <h1>Maison 3D</h1>
    <p>Explorez le salon, la cuisine, le garage, et montez à l'étage pour découvrir les chambres et la salle de bain.</p>
    <button id="go">Commencer la visite</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const $ = s => document.querySelector(s);
const canvas = $('#c');
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0);

// =============================================
// 1. SETUP RENDU (Optimisé Mobile)
// =============================================
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile });
renderer.setPixelRatio(isMobile ? Math.min(devicePixelRatio, 1.5) : Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8d4e6);
scene.fog = new THREE.Fog(0xb8d4e6, 40, 100);

const cam = new THREE.PerspectiveCamera(72, 1, 0.05, 150);
cam.rotation.order = 'YXZ';

// Environment map basique
const pmrem = new THREE.PMREMGenerator(renderer);
const envCanvas = document.createElement('canvas');
envCanvas.width = 512; envCanvas.height = 256;
const ectx = envCanvas.getContext('2d');
const grad = ectx.createLinearGradient(0, 0, 0, 256);
grad.addColorStop(0, '#a8d4e8');
grad.addColorStop(0.4, '#dce8f0');
grad.addColorStop(1, '#a89880');
ectx.fillStyle = grad;
ectx.fillRect(0, 0, 512, 256);
const envTex = new THREE.CanvasTexture(envCanvas);
envTex.mapping = THREE.EquirectangularReflectionMapping;
scene.environment = pmrem.fromEquirectangular(envTex).texture;

// =============================================
// 2. TEXTURES PROCÉDURALES AMÉLIORÉES
// =============================================
function makeTex(draw, rx, rz, size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, rz);
  t.anisotropy = isMobile ? 2 : 8;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// Texture de mur type "crépi / enduit" chaleureux
const wallTex = (color = '#e8e3dc') => makeTex((g, s) => {
  g.fillStyle = color;
  g.fillRect(0, 0, s, s);
  // Ajout de petits points pour le relief
  for (let j = 0; j < 1500; j++) {
    g.fillStyle = `rgba(180, 170, 160, ${Math.random() * 0.15})`;
    g.beginPath();
    g.arc(Math.random() * s, Math.random() * s, Math.random() * 2, 0, Math.PI * 2);
    g.fill();
  }
  // Légères ombres pour le relief
  for (let j = 0; j < 200; j++) {
    g.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.2})`;
    g.fillRect(Math.random() * s, Math.random() * s, 2, 2);
  }
}, 4, 4);

const woodTex = (rx, rz) => makeTex((g, s) => {
  for (let i = 0; i < 8; i++) {
    const l = 42 + (i % 3) * 4;
    g.fillStyle = `hsl(28, 38%, ${l}%)`;
    g.fillRect(0, i * s / 8, s, s / 8);
    g.fillStyle = 'rgba(0,0,0,.18)';
    g.fillRect(0, i * s / 8, s, 2);
    for (let j = 0; j < 40; j++) {
      g.fillStyle = `rgba(60,40,20,${Math.random() * 0.1})`;
      g.fillRect(Math.random() * s, i * s / 8 + Math.random() * s / 8, Math.random() * 50, 1);
    }
  }
}, rx, rz);

const tileTex = (rx, rz) => makeTex((g, s) => {
  g.fillStyle = '#ebeef0';
  g.fillRect(0, 0, s, s);
  for (let j = 0; j < 300; j++) {
    g.fillStyle = `rgba(180,190,200,${Math.random() * 0.2})`;
    g.fillRect(Math.random() * s, Math.random() * s, 2, 2);
  }
  g.strokeStyle = '#c8d0d6';
  g.lineWidth = 4;
  g.strokeRect(0, 0, s, s);
}, rx, rz);

const fabricTex = (rx, rz, baseHue = 200) => makeTex((g, s) => {
  g.fillStyle = `hsl(${baseHue}, 12%, 72%)`;
  g.fillRect(0, 0, s, s);
  for (let j = 0; j < 2000; j++) {
    g.fillStyle = `rgba(0,0,0,${Math.random() * 0.08})`;
    g.fillRect(Math.random() * s, Math.random() * s, 1, 1);
  }
}, rx, rz);

// =============================================
// 3. MATÉRIAUX AMÉLIORÉS
// =============================================
const MAT = {
  wall: new THREE.MeshStandardMaterial({ map: wallTex('#f0ebe4'), roughness: 0.95 }),
  wallAccent: new THREE.MeshStandardMaterial({ map: wallTex('#4a5568'), roughness: 0.9 }), // Mur d'accent sombre
  wallOut: new THREE.MeshStandardMaterial({ color: 0xd4cec4, roughness: 0.9 }),
  trim: new THREE.MeshStandardMaterial({ color: 0xfaf8f4, roughness: 0.5 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xc8e4f0, transparent: true, opacity: 0.3, roughness: 0.05, metalness: 0, transmission: 0.9, thickness: 0.1 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xb8bcc0, metalness: 0.9, roughness: 0.25 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xd4af6a, metalness: 0.85, roughness: 0.3 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x1a1a1f, roughness: 0.4 }),
  wood: new THREE.MeshStandardMaterial({ map: woodTex(1, 1), roughness: 0.7 }),
  woodDark: new THREE.MeshStandardMaterial({ color: 0x4a3626, roughness: 0.75 }),
  fabric: new THREE.MeshStandardMaterial({ map: fabricTex(2, 2, 210), roughness: 1 }),
  fabricWarm: new THREE.MeshStandardMaterial({ map: fabricTex(2, 2, 30), roughness: 1 }),
  white: new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.6 }),
  black: new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.3 }),
  green: new THREE.MeshStandardMaterial({ color: 0x3a6a4a, roughness: 0.85 }),
  terracotta: new THREE.MeshStandardMaterial({ color: 0xb87050, roughness: 0.9 }),
  emissive: new THREE.MeshStandardMaterial({ color: 0xfff8ee, emissive: 0xffdba8, emissiveIntensity: 1.5 }),
};

// =============================================
// 4. OUTILS DE CONSTRUCTION
// =============================================
const solids = [];
const floor1Group = new THREE.Group();
const slabGroup = new THREE.Group();
scene.add(floor1Group, slabGroup);
let currentGroup = scene;

const H1 = 2.8;
const H2 = 2.8;
const FLOOR_GAP = 0.2;
const Y2 = H1 + FLOOR_GAP;

function bx(x, y, z, w, h, d, matOrColor, col = true, floors = [0, Y2]) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    typeof matOrColor === 'object' ? matOrColor : new THREE.MeshStandardMaterial({ color: matOrColor, roughness: 0.85 }));
  mesh.position.set(x, y + h / 2, z);
  mesh.castShadow = !isMobile;
  mesh.receiveShadow = true;
  currentGroup.add(mesh);
  if (col && floors.length > 0) {
    floors.forEach(f => solids.push({ x1: x - w/2, x2: x + w/2, z1: z - d/2, z2: z + d/2, floor: f }));
  }
  return mesh;
}

function cy(x, y, z, r, h, mat, col = false, floors = []) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), mat);
  mesh.position.set(x, y + h / 2, z);
  mesh.castShadow = !isMobile;
  mesh.receiveShadow = true;
  currentGroup.add(mesh);
  if (col) floors.forEach(f => solids.push({ x1: x - r, x2: x + r, z1: z - r, z2: z + r, floor: f }));
  return mesh;
}

function plane(x, y, z, w, d, mat, rotX = -Math.PI / 2, col = false, floor = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = rotX;
  m.position.set(x, y, z);
  m.receiveShadow = true;
  currentGroup.add(m);
  if (col) solids.push({ x1: x - w/2, x2: x + w/2, z1: z - d/2, z2: z + d/2, floor });
  return m;
}

// Murs avec portes
function wallX(z, x1, x2, doors, floorY, mat = MAT.wall) {
  const H = floorY === 0 ? H1 : H2;
  const sortedDoors = [...doors].sort((a, b) => a.x - b.x);
  let cur = x1;
  for (const d of sortedDoors) {
    const dl = d.x - d.w / 2, dr = d.x + d.w / 2;
    if (dl > cur + 0.02) bx((cur + dl) / 2, floorY, z, dl - cur, H, 0.14, mat, true, [floorY]);
    bx(d.x, floorY + 2.1, z, d.w, H - 2.1, 0.14, mat, false, []);
    bx(d.x, floorY, z, d.w + 0.15, 0.06, 0.18, MAT.trim, false, []);
    cur = dr;
  }
  if (x2 > cur + 0.02) bx((cur + x2) / 2, floorY, z, x2 - cur, H, 0.14, mat, true, [floorY]);
}

function wallZ(x, z1, z2, doors, floorY, mat = MAT.wall) {
  const H = floorY === 0 ? H1 : H2;
  const sortedDoors = [...doors].sort((a, b) => a.z - b.z);
  let cur = z1;
  for (const d of sortedDoors) {
    const dt = d.z - d.w / 2, db = d.z + d.w / 2;
    if (dt > cur + 0.02) bx(x, floorY, (cur + dt) / 2, 0.14, H, dt - cur, mat, true, [floorY]);
    bx(x, floorY + 2.1, d.z, 0.14, H - 2.1, d.w, mat, false, []);
    bx(x, floorY, d.z, 0.18, 0.06, d.w + 0.15, MAT.trim, false, []);
    cur = db;
  }
  if (z2 > cur + 0.02) bx(x, floorY, (cur + z2) / 2, 0.14, H, z2 - cur, mat, true, [floorY]);
}

// =============================================
// 5. RDC — SOLS & MURS
// =============================================
currentGroup = scene;
plane(0, -0.02, 0, 80, 80, new THREE.MeshStandardMaterial({ color: 0x7a9a6a, roughness: 1 }));

const woodFloorMat = new THREE.MeshStandardMaterial({ map: woodTex(8, 8), roughness: 0.6 });
const tileFloorMat = new THREE.MeshStandardMaterial({ map: tileTex(6, 6), roughness: 0.35 });
const garageMat = new THREE.MeshStandardMaterial({ color: 0x5a5f65, roughness: 0.9 });

const fGarage = plane(-6.25, 0, 0, 5.5, 14, garageMat, -Math.PI/2, false); fGarage.userData.room = 'garage';
const fSalon = plane(-0.75, 0, 3.5, 5.5, 7, woodFloorMat, -Math.PI/2, false); fSalon.userData.room = 'salon';
const fCuisine = plane(-0.75, 0, -3.5, 5.5, 7, tileFloorMat, -Math.PI/2, false); fCuisine.userData.room = 'cuisine';
const fEntree = plane(5.5, 0, 0, 7, 14, tileFloorMat, -Math.PI/2, false); fEntree.userData.room = 'salon';

plane(-0.75, 0.01, 3, 3.5, 2.5, new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 1 })); // Tapis

// Murs extérieurs
bx(0, 0, -7, 18.4, H1 + FLOOR_GAP + H2, 0.2, MAT.wallOut, true, [0, Y2]);
bx(0, 0, 7, 18.4, H1 + FLOOR_GAP + H2, 0.2, MAT.wallOut, true, [0, Y2]);
bx(-9, 0, 0, 0.2, H1 + FLOOR_GAP + H2, 14.4, MAT.wallOut, true, [0, Y2]);
bx(9, 0, 0, 0.2, H1 + FLOOR_GAP + H2, 14.4, MAT.wallOut, true, [0, Y2]);

// Murs intérieurs RDC
wallZ(-3.5, -7, 7, [{ z: 1.5, w: 1.2 }], 0);
wallX(0, -3.5, 2, [{ x: -0.75, w: 3.2 }], 0, MAT.wallAccent); // Mur d'accent derrière la TV
wallZ(2, 0, 7, [{ z: 3.5, w: 1.2 }], 0);
wallZ(2, -7, 0, [{ z: -3, w: 1.2 }], 0);

// =============================================
// 6. RDC — MOBILIER
// =============================================
// --- SALON ---
bx(-1.5, 0, 5, 3.4, 0.45, 1.1, MAT.fabric, true, [0]);
bx(-1.5, 0.45, 5.5, 3.4, 0.55, 0.2, MAT.fabric, false);
bx(-3.1, 0, 5, 0.2, 0.65, 1.1, MAT.fabric, false);
bx(0.1, 0, 5, 0.2, 0.65, 1.1, MAT.fabric, false);
bx(-2.3, 0.5, 5.1, 0.5, 0.4, 0.15, MAT.fabricWarm, false);
bx(-0.7, 0.5, 5.1, 0.5, 0.4, 0.15, MAT.fabricWarm, false);

bx(-1.5, 0, 3.2, 1.8, 0.38, 0.9, MAT.wood, true, [0]);
bx(-1.5, 0.38, 3.2, 1.7, 0.04, 0.8, MAT.white, false);

bx(-1.5, 0, 1.4, 2.4, 0.5, 0.4, MAT.woodDark, true, [0]);
bx(-1.5, 0.75, 1.35, 1.6, 0.9, 0.06, MAT.black, false);
const tvScreen = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.82), 
  new THREE.MeshStandardMaterial({ color: 0x1a2a3a, emissive: 0x2a4a6a, emissiveIntensity: 0.6, roughness: 0.2 }));
tvScreen.position.set(-1.5, 1.2, 1.31);
currentGroup.add(tvScreen);

function plant(x, z, scale = 1) {
  cy(x, 0, z, 0.22 * scale, 0.35 * scale, MAT.terracotta, true, [0, Y2]);
  for (let i = 0; i < 4; i++) {
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.28 * scale, 0), MAT.green);
    s.position.set(x + (Math.random() - 0.5) * 0.3, 0.6 * scale + Math.random() * 0.3, z + (Math.random() - 0.5) * 0.3);
    s.castShadow = !isMobile;
    currentGroup.add(s);
  }
}
plant(-3, 6.5);
plant(1.5, 1, 0.8);

function painting(x, y, z, w, h, rotY, c1, c2) {
  bx(x, y - h/2, z, rotY === 0 ? w + 0.1 : 0.06, h + 0.1, rotY === 0 ? 0.06 : w + 0.1, MAT.woodDark, false);
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = c1; g.fillRect(0, 0, 256, 256);
  g.fillStyle = c2;
  g.beginPath(); g.arc(128, 128, 80, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.2)';
  g.fillRect(30, 30, 80, 80);
  const t = new THREE.CanvasTexture(c);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: t, roughness: 0.5 }));
  p.position.set(x + (rotY === 0 ? 0 : 0.04), y, z + (rotY === 0 ? 0.04 : 0));
  p.rotation.y = rotY;
  currentGroup.add(p);
}
painting(-3.5, 1.7, 3.5, 0.9, 0.7, Math.PI/2, '#d4a86a', '#8a5a3a');

// --- CUISINE ---
bx(-0.75, 0, -2.5, 2.6, 0.9, 1.2, MAT.white, true, [0]);
bx(-0.75, 0.9, -2.5, 2.7, 0.05, 1.3, MAT.dark, false);
[-1.3, -0.75, -0.2].forEach(x => {
  cy(x, 0, -1.7, 0.18, 0.05, MAT.dark);
  cy(x, 0.05, -1.7, 0.03, 0.6, MAT.metal);
  cy(x, 0.65, -1.7, 0.2, 0.08, MAT.wood);
});
bx(-0.75, 0, -6.5, 4, 0.9, 0.6, MAT.white, true, [0]);
bx(-0.75, 1.9, -6.5, 4, 0.7, 0.4, MAT.wood, false);
bx(-0.75, 0.9, -6.5, 4.1, 0.05, 0.7, MAT.dark, false);
bx(-1.8, 0.92, -6.5, 0.5, 0.03, 0.35, MAT.metal, false);
cy(-1.8, 0.95, -6.7, 0.02, 0.3, MAT.metal);
bx(2.3, 0, -6.5, 0.8, 2.0, 0.7, MAT.metal, true, [0]);

// --- GARAGE ---
bx(-6.5, 0.2, 3.5, 2.0, 0.6, 4.2, MAT.black, true, [0]);
bx(-6.5, 0.8, 3.5, 1.7, 0.5, 2.0, new THREE.MeshPhysicalMaterial({ color: 0x2a3a4a, roughness: 0.2, metalness: 0.5 }), false);
[-4.8, -8.2].forEach(x => {
  [2, 5].forEach(z => {
    cy(x, 0.15, z, 0.3, 0.3, MAT.black, false);
    cy(x, 0.15, z, 0.15, 0.31, MAT.metal, false);
  });
});
bx(-8.5, 0, -5, 0.5, 1.2, 3, MAT.woodDark, true, [0]);

// --- ESCALIER ---
const stairSteps = 18;
const stepH = Y2 / stairSteps;
const stepD = 0.25;
const stairBaseZ = 6;
const stairX = 7;
for (let i = 0; i < stairSteps; i++) {
  const y = i * stepH;
  const z = stairBaseZ - i * stepD - stepD/2;

      while (obj && !obj.userData.room) obj = obj.parent;

// Réinitialiser au toucher
joyZone.addEventListener('touchstart', e => {
  e.preventDefault();
  if (mode !== 'walk') return;
  for (let t of e.changedTouches) {
    if (!joyId) {
      joyId = t.identifier;
      joyStart = { x: t.clientX, y: t.clientY };
      joyBase.style.display = 'block';
      joyBase.style.left = t.clientX + 'px';
      joyBase.style.top = t.clientY + 'px';
      joyKnob.style.transform = 'translate(-50%, -50%)';
    }
  }
}, { passive: false });

joyZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let t of e.changedTouches) {
    if (t.identifier === joyId) {
      let dx = t.clientX - joyStart.x;
      let dy = t.clientY - joyStart.y;
      const max = 35;
      const dist = Math.hypot(dx, dy);
      if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      joyVec = { x: dx / max, y: dy / max };
    }
  }
}, { passive: false });

const endTouch = e => {
  for (let t of e.changedTouches) {
    if (t.identifier === joyId) {
      joyId = null; joyVec = { x: 0, y: 0 };
      joyBase.style.display = 'none';
    }
    if (t.identifier === lookId) lookId = null;
  }
};

// 15. BOUCLE D'ANIMATION
// =============================================
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  if ((mode === 'plan-rdc' || mode === 'plan-etage') && !tw) cur.y = Math.max(22, 20 / cam.aspect);
}
addEventListener('resize', resize);
resize();
Object.assign(cur, planRdcPose());

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  
  if (tw) {
    tw.t += dt / tw.dur;
    const k = ease(Math.min(1, tw.t));
    const f = tw.from, t = tw.to;
    const dy = ((t.yaw - f.yaw + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    cur.x = f.x + (t.x - f.x) * k; cur.z = f.z + (t.z - f.z) * k;
    cur.y = f.y + (t.y - f.y) * k; cur.yaw = f.yaw + dy * k; cur.pitch = f.pitch + (t.pitch - f.pitch) * k;
    if (tw.t >= 1) { Object.assign(cur, t); tw = null; updateFloorVisibility(); }
  } else if (mode === 'walk') {
    const sp = (keys.shift ? 4 : 2.2) * dt;
    let f = (keys.w || keys.z || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0) - joyVec.y;
    let r = (keys.d ? 1 : 0) - (keys.q || keys.a ? 1 : 0) + joyVec.x;
    
    cur.yaw += ((keys.arrowleft ? 1 : 0) - (keys.arrowright ? 1 : 0)) * 1.8 * dt;
    
    const sn = Math.sin(cur.yaw), cs = Math.cos(cur.yaw);
    const dx = (-sn * f + cs * r) * sp;
    const dz = (-cs * f - sn * r) * sp;
    
    const fl = currentFloor();
    if (!blocked(cur.x + dx, cur.z, fl)) cur.x += dx;
    if (!blocked(cur.x, cur.z + dz, fl)) cur.z += dz;
  }
  
  cam.position.set(cur.x, cur.y, cur.z);
  cam.rotation.set(cur.pitch, cur.yaw, 0);
  
  let label = 'top';
  if (mode === 'plan-rdc') label = 'plan-rdc';
  else if (mode === 'plan-etage') label = 'plan-etage';
  else {
    const is1 = cur.y > Y2 - 0.5;
    if (!is1) {
      if (cur.x < -3.5) label = 'garage';
      else if (cur.x < 2) label = cur.z > 0 ? 'salon' : 'cuisine';
      else label = 'salon';
    } else {
      if (cur.x < 0) label = 'chambre1';
      else if (cur.x < 4) label = cur.z > 0 ? 'sdb' : 'chambre2';
      else label = 'sdb';
    }
  }
  hud(label);
  drawMap();
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}

hud('plan-rdc');
requestAnimationFrame(loop);
</script>
</body>
</html>
